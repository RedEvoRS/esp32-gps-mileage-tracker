# Mileage Tracker server
#
# Two default services (optional monitor and ntfy profiles below):
#   mileage-ingest  (port 8090) accepts trip uploads from the T-Beam and
#                   stores each one in ./data as the raw GPX plus a JSON
#                   summary.
#   mileage-viewer  (port 8091) the web UI: trip list, map, purpose tags,
#                   CSV/XLSX export. It reads ./data read-only.
# Optional profiles:
#   mileage-monitor (port 8093) provides /metrics when enabled; no third-party deps.
#   ntfy            (port 8092) self-hosted phone notifications.
#
# install.sh sets all of this up and checks it. By hand, before first run
# (README.md in this folder and DEPLOY_DEBIAN.md have the details):
#   1. Create ./data yourself, owned by UID 1000, or uploads fail with 500
#   2. Copy .env.example to .env, set INGEST_AUTH_TOKEN to a long random
#      string and DISPLAY_TZ to your timezone (e.g. America/Chicago)
#   3. Copy viewer.env.example to viewer.env and set the viewer login.
#      Compose won't build or start anything until viewer.env exists.
#   4. Run: SERVER_VERSION=$(python3 stamp_version.py) BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose up -d --build
#      Keeps cached image IDs stable; install.sh sets it automatically.
#
# After editing .env or viewer.env, run docker compose up -d again;
# docker compose restart keeps the old values.
#
# Published ports listen on every host interface until you set BIND_ADDR in
# .env to the server's LAN IP (DEPLOY_DEBIAN.md Step 7). Set it: UFW
# does not filter Docker-published ports, so the bind address is the
# only thing keeping them off other interfaces.

# Applies when containers are created; Compose recreates them when this changes.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mileage-ingest:
    logging: *bounded-logs
    build:
      context: .
      dockerfile: mileage-ingest/Dockerfile
      args:
        SERVER_VERSION: ${SERVER_VERSION:-unversioned}
    container_name: mileage-ingest
    restart: ${RESTART_POLICY:-unless-stopped}

    # Host port 8090 maps to container port 8090, on BIND_ADDR only.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8090:8090"

    # The ./data directory on the host gets mounted into the container
    # at /data, which is where the app writes trip files. This means
    # your trip files persist outside the container and survive
    # container rebuilds, restarts, and even docker compose down -v.
    volumes:
      - ./data:/data

    environment:
      # The auth token is read from the .env file (never commit .env!)
      - INGEST_AUTH_TOKEN=${INGEST_AUTH_TOKEN}
      # DISPLAY_TZ comes from .env (install.sh asks for it). Here it picks
      # which local month a trip is filed under (data/YYYY-MM/); the viewer
      # gets the same value, so the folder and the displayed date agree at
      # month boundaries. Timestamps in the files stay UTC. There's no
      # default: unset, the service stops with a message saying so.
      - DISPLAY_TZ=${DISPLAY_TZ:-}
      # Log timestamps in the same zone (UTC if DISPLAY_TZ is unset)
      - TZ=${DISPLAY_TZ:-UTC}

    # Healthcheck lets Docker know when the service is actually ready
    # to accept requests, not just when the container has started.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The viewer/export service: a web UI to browse trips, audit each track
  # on an OpenStreetMap map, tag trip purpose, and export to CSV/XLSX.
  # It reads the same ./data directory READ-ONLY (the GPX/JSON files are
  # owned by the ingest service) and keeps its own annotations database
  # in a separate named volume.
  mileage-viewer:
    logging: *bounded-logs
    build:
      context: .
      dockerfile: mileage-viewer/Dockerfile
      args:
        SERVER_VERSION: ${SERVER_VERSION:-unversioned}
    container_name: mileage-viewer
    restart: ${RESTART_POLICY:-unless-stopped}

    # Override only the viewer's host address for a reverse proxy.
    ports:
      - target: 8091
        published: "8091"
        host_ip: "${VIEWER_BIND_ADDR:-${BIND_ADDR:-0.0.0.0}}"

    volumes:
      # Same trip data as ingest, but read-only — the viewer never
      # modifies GPX or summary files.
      - ./data:/data:ro
      # Annotations (trip purpose + notes) live here, separate from the
      # immutable trip data so losing them never risks the trips.
      - viewer-db:/db

    # Login credentials + session key come from their own env file, passed
    # through verbatim. Two reasons this is separate from .env:
    #   1. The viewer has no business holding the ingest auth token.
    #   2. Single-quoting the hash in viewer.env (as the example shows)
    #      preserves its '$' separators; unquoted values are interpolated.
    env_file:
      - ./viewer.env

    environment:
      - VIEWER_DB_PATH=/db/annotations.db
      - VIEWER_TRUSTED_PROXIES=${VIEWER_TRUSTED_PROXIES:-}
      - VIEWER_COOKIE_SECURE=${VIEWER_COOKIE_SECURE:-false}
      # Timezone all trip times are displayed and exported in, from .env
      # (see the note on the ingest service).
      - DISPLAY_TZ=${DISPLAY_TZ:-}
      - TZ=${DISPLAY_TZ:-UTC}

    # Wait for the ingest service so ./data exists, though the viewer
    # tolerates an empty/missing data dir on its own.
    depends_on:
      - mileage-ingest

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Opt in with --profile monitor. Port 8093 serves only optional, token-protected
  # Prometheus metrics; the service has no ingest or viewer credentials.
  mileage-monitor:
    logging: *bounded-logs
    profiles: ["monitor"]
    build:
      context: .
      dockerfile: mileage-monitor/Dockerfile
      args:
        SERVER_VERSION: ${SERVER_VERSION:-unversioned}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ./data:/data:ro
      - monitor-state:/state
    # Defaulting to the disabled example keeps install.sh and --check usable
    # without creating another private env file or needing newer env_file syntax.
    env_file:
      - ${MONITOR_ENV_FILE:-./monitor.env.example}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8093:8093"
    depends_on:
      - mileage-ingest

  # Opt in separately: an existing self-hosted ntfy can be used instead.
  ntfy:
    logging: *bounded-logs
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:v2.31.0
    command: ["serve"]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8092:80"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-state:/var/lib/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-}
      - NTFY_BEHIND_PROXY=${NTFY_BEHIND_PROXY:-false}

# Separate named volumes; none of these lives in the ingest data directory.
volumes:
  viewer-db:
  monitor-state:
  ntfy-state:
