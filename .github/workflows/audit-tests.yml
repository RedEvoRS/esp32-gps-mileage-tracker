name: Audit regression tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new commit replaces an older run for the same PR; other events get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pii-scan:
    # The repo is meant to go public, so files, commit messages and author
    # emails must carry nothing personal. PII_DENYLIST is a repo secret
    # (one term per line: real name, personal email, street, SSID, ...).
    # Dependabot cannot read the secret; only its scan is skipped. The
    # tools and firmware release checks still run on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install flash test dependency
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Test the scanner
        run: python -m unittest discover -s tools -v
      - name: Check firmware version increase and reviewed release notes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/firmware_release.py check --base "$BASE_SHA" --ref "$HEAD_SHA"
      - name: Scan files, and on a PR its commits, for personal info
        if: github.actor != 'dependabot[bot]'
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
          COMMITS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: python tools/check_pii.py ${COMMITS:+--commits "$COMMITS"}

  # Strict up-to-date required checks mean main receives exactly the files tested on the PR.
  # Keep the push run as the PII backstop; the other checks run on PRs and manual runs.
  server:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Lint Python
        run: |
          python -m pip install -r tools/lint/requirements.txt
          ruff check
      - name: Install service dependencies
        run: python -m pip install --require-hashes -r server/mileage-ingest/requirements.txt -r server/mileage-viewer/requirements.txt
      - name: Install backup test tools
        # test_backup skips without these; make sure CI never skips it.
        run: command -v rsync || (sudo apt-get update && sudo apt-get install -y rsync)
      - name: Run server regression tests
        run: python -m unittest discover -s server/tests -v
      - name: Check generated diagnostics catalog
        run: python tools/generate_error_catalog.py --check
      - name: Check map parser integration
        run: |
          node server/tests/test_viewer_map.js
          node server/tests/test_viewer_places.js

  firmware-host:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install local diagnostics ingest bridge dependencies
        run: python -m pip install --require-hashes -r server/mileage-ingest/requirements.txt
      - name: Check out TinyGPSPlus 1.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikalhart/TinyGPSPlus
          ref: 81ba32cc9ac63a8e4c20ae624ac48513766c88fc
          path: .audit-tools/TinyGPSPlus
          persist-credentials: false
      - name: Run filesystem and real-parser host tests
        env:
          TINYGPS_DIR: ${{ github.workspace }}/.audit-tools/TinyGPSPlus/src
        run: |
          test -f "$TINYGPS_DIR/TinyGPS++.cpp"
          bash firmware/host_test/run.sh

  firmware-compile:
    # One runner shares the toolchain and core build cache across all sketches.
    # Compilation only; OLED/SD/power behavior still needs hardware validation.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      builder: ${{ steps.paths.outputs.builder }}
      windows: ${{ steps.paths.outputs.windows }}
    env:
      # When updating the CLI version, update SHA-256 from that release's checksums file.
      ARDUINO_CLI_VERSION: '1.5.1'
      ARDUINO_CLI_SHA256: '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b'
      ESP32_CORE_VERSION: '3.3.11'
      XPOWERS_VERSION: '0.3.3'
      TINYGPS_VERSION: '1.0.3'
      U8G2_VERSION: '2.36.18'
      ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=8M,PSRAM=enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate expensive integration work by changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_paths.py
      - name: Install Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          install_dir="$RUNNER_TEMP/arduino-cli-bin"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          printf '%s  %s\n' "$ARDUINO_CLI_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" arduino-cli
          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          arduino-cli version
      - name: Cache ESP32 core, toolchain downloads and libraries
        id: arduino-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-${{ runner.arch }}-arduino-v1-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ESP32_CORE_VERSION }}-xpowers-${{ env.XPOWERS_VERSION }}-tinygps-${{ env.TINYGPS_VERSION }}-u8g2-${{ env.U8G2_VERSION }}
      - name: Install pinned core and libraries
        if: steps.arduino-cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION" --additional-urls "$ESP32_INDEX_URL"
          arduino-cli lib update-index
          arduino-cli lib install "XPowersLib@$XPOWERS_VERSION" "TinyGPSPlus@$TINYGPS_VERSION" "U8g2@$U8G2_VERSION"
      # rev-parse HEAD works in the default shallow checkout; no tags needed.
      - name: Stamp Stage 4 firmware version
        run: python3 tools/stamp_firmware_version.py
      - name: Compile all four sketches
        shell: bash
        run: |
          cp firmware/secrets.h.example firmware/04_trip_logger/secrets.h
          trap 'rm -f firmware/04_trip_logger/secrets.h' EXIT
          for sketch in 01_hello_world 02_pmu_test 03_gps_test 04_trip_logger; do
            echo "::group::Compile $sketch"
            size_args=()
            if [ -f "firmware/$sketch/partitions.csv" ]; then
              # The core copies this CSV, but CLI still uses the board menu's
              # upload.maximum_size. Tie its built-in size check to the CSV.
              max_size=$(python3 - "firmware/$sketch/partitions.csv" <<'PY'
          import csv
          import sys

          def size_bytes(value):
              value = value.strip().upper()
              if value.endswith(("K", "M")):
                  return int(value[:-1], 0) * {"K": 1024, "M": 1024 * 1024}[value[-1]]
              return int(value, 0)

          with open(sys.argv[1]) as source:
              rows = csv.reader(line.split("#", 1)[0] for line in source)
              sizes = [size_bytes(row[4]) for row in rows
                       if len(row) >= 5 and row[1].strip().lower() in ("app", "0", "0x00")]
          if not sizes or min(sizes) <= 0:
              raise SystemExit("Partition table must contain a positive app partition")
          # Require the image to fit every app slot if OTA partitions are added.
          print(min(sizes))
          PY
              )
              echo "App partition limit: $max_size bytes"
              size_args=(--build-property "upload.maximum_size=$max_size")
            fi
            output_args=()
            if [[ $sketch == 04_trip_logger && '${{ steps.paths.outputs.builder }}' == true ]]; then
              output_args=(--output-dir "$RUNNER_TEMP/stage4")
            fi
            arduino-cli compile --fqbn "$FQBN" --warnings default --jobs 2 \
              "${size_args[@]}" "${output_args[@]}" --build-property 'compiler.cpp.extra_flags=-DFIRMWARE_VERSION_REQUIRE_STAMP' \
              "firmware/$sketch"
            echo "::endgroup::"
          done
      - name: Record Stage 4 provenance for builder parity
        if: steps.paths.outputs.builder == 'true'
        env:
          REFERENCE: ${{ runner.temp }}/stage4
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path(os.environ['REFERENCE'])
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          version = Path('firmware/VERSION').read_text().strip() + '+' + commit[:10]
          assert version.encode('ascii') in (root / '04_trip_logger.ino.bin').read_bytes()
          (root / 'provenance.json').write_text(json.dumps(dict(commit=commit, version=version, fqbn=os.environ['FQBN'])))
          PY
      - name: Share only the synthetic Stage 4 app and provenance
        if: steps.paths.outputs.builder == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage4-reference
          path: |
            ${{ runner.temp }}/stage4/04_trip_logger.ino.bin
            ${{ runner.temp }}/stage4/provenance.json
          if-no-files-found: error
          retention-days: 1

  installer:
    needs: firmware-compile
    if: github.event_name != 'push'
    # Runs server/install.sh for real on a fresh VM: Docker builds, the
    # test upload, the viewer login and exports, and backups through
    # systemd. Then reruns it, has it repair a mangled config, restarts
    # Docker and checks again, and makes sure --check notices a broken
    # install.
    # Match Docker 29 and its containerd image store, installed from Docker's
    # Debian repo by DEPLOY_DEBIAN.md, so CI exercises the real server setup.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PASSWORD: correct-horse-battery
    steps:
      - name: Disk at installer job start
        run: |
          df -h /
          docker system df
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: shellcheck server/install.sh install/setup.sh install/flash.sh server/firmware-builder/build.sh tools/build_release_bundle.sh tools/ci-install/*.sh
      - name: Make a login like a fresh Debian install's
        # UID 1000 with sudo, not in the docker group yet, and the server
        # files in ~/mileage-tracker, as DEPLOY_DEBIAN.md Step 2 leaves them.
        run: |
          user=$(getent passwd 1000 | cut -d: -f1)
          if [ -z "$user" ]; then
            sudo useradd --create-home --uid 1000 --shell /bin/bash tester
            user=tester
          fi
          home=$(getent passwd "$user" | cut -d: -f6)
          sudo install -d -o "$user" "$home"
          sudo gpasswd -d "$user" docker || true
          # sudoers takes the last matching rule; zz- sorts after any existing
          # rule for this user.
          echo "$user ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/zz-installer-test
          sudo -l -U "$user"
          sudo -u "$user" sudo -n true
          sudo cp -r server "$home/mileage-tracker"
          sudo chown -R "$user:" "$home/mileage-tracker"
          # The "off-host" backup target: same disk here, so the script asks.
          sudo install -d -o "$user" /srv/offhost
          {
            echo "TEST_USER=$user"
            echo "INSTALLER=$home/mileage-tracker/install.sh"
            echo "LAN_ADDR=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')"
          } >> "$GITHUB_ENV"
      - name: Without a terminal, a sudo password stops it, and it says why
        # Steps have no terminal, so with a password-only sudo rule the
        # script can't ask. It has to say that, not blame the sudoers file.
        run: |
          if [ "$TEST_USER" = "$(id -un)" ]; then
            echo "Skipped: the test user is the runner itself"
            exit 0
          fi
          echo "$TEST_USER ALL=(ALL) ALL" | sudo tee /etc/sudoers.d/zz-installer-test
          # The runner owns these logs; only the installer changes user.
          if { sudo -u "$TEST_USER" -H bash "$INSTALLER" < /dev/null; } > nosudo.log 2>&1; then
            cat nosudo.log
            echo "install.sh carried on without sudo"
            exit 1
          fi
          cat nosudo.log
          grep -q "isn't running in a terminal" nosudo.log
          echo "$TEST_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/zz-installer-test
          sudo -u "$TEST_USER" sudo -n true
      - name: Install
        run: |
          sudo -u "$TEST_USER" -H env \
            INSTALL_BIND_ADDR="$LAN_ADDR" \
            INSTALL_DISPLAY_TZ=America/Chicago \
            INSTALL_VIEWER_USER=tester \
            INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            INSTALL_WAIT_ONLINE=y \
            INSTALL_BACKUPS=y \
            INSTALL_BACKUP_REMOTE=/srv/offhost \
            INSTALL_SAME_DISK=y \
            INSTALL_PING_URL= \
            INSTALL_OUTPUTS=none \
            bash "$INSTALLER" < /dev/null
          test "$(docker exec mileage-viewer printenv DISPLAY_TZ)" = America/Chicago
          for container in mileage-ingest mileage-viewer; do
            test "$(docker inspect -f '{{.HostConfig.LogConfig.Type}}:{{index .HostConfig.LogConfig.Config "max-size"}}:{{index .HostConfig.LogConfig.Config "max-file"}}' "$container")" = json-file:10m:3
          done
          # Backups are private to the backup user (umask 077).
          test -n "$(sudo ls /srv/offhost/snapshots)"
          systemctl is-enabled "mileage-backup@$TEST_USER.timer"
      - name: Run it again; it keeps everything
        run: |
          before=$(docker inspect -f '{{.State.StartedAt}}' mileage-ingest mileage-viewer)
          sudo -u "$TEST_USER" -H env INSTALL_KEEP_LOGIN=y INSTALL_KEEP_OUTPUTS=y INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            bash "$INSTALLER" < /dev/null
          test "$before" = "$(docker inspect -f '{{.State.StartedAt}}' mileage-ingest mileage-viewer)"
      - name: A re-run with nothing to fix doesn't ask for sudo
        # With a password-only sudo rule and no terminal, any sudo prompt
        # stops the run, so this only passes if it never asks (#22).
        run: |
          if [ "$TEST_USER" = "$(id -un)" ]; then
            echo "Skipped: the test user is the runner itself"
            exit 0
          fi
          echo "$TEST_USER ALL=(ALL) ALL" | sudo tee /etc/sudoers.d/zz-installer-test
          status=0
          { sudo -u "$TEST_USER" -H env INSTALL_KEEP_LOGIN=y INSTALL_KEEP_OUTPUTS=y INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            bash "$INSTALLER" < /dev/null; } > rerun.log 2>&1 || status=$?
          echo "$TEST_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/zz-installer-test
          cat rerun.log
          test "$status" = 0
          grep -q "Nothing needs root so far" rerun.log
          ! grep -q "Root is needed" rerun.log
      - name: Repair a hash that lost its quotes and a .env with CRLF endings
        run: |
          dir=$(dirname "$INSTALLER")
          sudo -u "$TEST_USER" sed -i "s/^VIEWER_PASSWORD_HASH='\(.*\)'\$/VIEWER_PASSWORD_HASH=\1/" "$dir/viewer.env"
          sudo -u "$TEST_USER" sed -i 's/$/\r/' "$dir/.env"
          sudo -u "$TEST_USER" -H env INSTALL_KEEP_LOGIN=y INSTALL_KEEP_OUTPUTS=y INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            bash "$INSTALLER" < /dev/null
          sudo grep -q "^VIEWER_PASSWORD_HASH='" "$dir/viewer.env"
          ! sudo grep -q $'\r' "$dir/.env"
      - name: Restart Docker, then check with viewer on loopback
        run: |
          dir=$(dirname "$INSTALLER")
          sudo -u "$TEST_USER" bash -c 'printf "\nVIEWER_BIND_ADDR=127.0.0.1\n" >> "$1/.env"' _ "$dir"
          sudo -u "$TEST_USER" -H bash -c 'cd "$1" && SERVER_VERSION=$(python3 stamp_version.py) docker compose up -d --no-build mileage-viewer' _ "$dir"
          sudo systemctl restart docker
          sudo -u "$TEST_USER" -H env INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            bash "$INSTALLER" --check < /dev/null
      - name: Two --checks at once delete only their own test trips
        # Each run uploads under its own test ID and deletes only that
        # (#43). A trip under the old fixed ID, in the same month folder,
        # has to come through byte for byte. Both trips are untimed: ingest
        # ignores X-Trip-Id for a timed GPX, and files an untimed one under
        # the current month.
        run: |
          dir=$(dirname "$INSTALLER")
          token=$(sudo sed -n 's/^INGEST_AUTH_TOKEN=//p' "$dir/.env" | tail -n 1)
          sed -e 's/Test drive/Not the test drive/' -e 's#<time>[^<]*</time>##g' \
            "$dir/sample.gpx" > other.gpx
          stored=$(curl -fsS -H @<(printf 'Authorization: Bearer %s\n' "$token") \
            -H 'Content-Type: application/gpx+xml' \
            -H 'X-Device-Id: install-check' -H 'X-Trip-Id: install-check' \
            --data-binary @other.gpx "http://$LAN_ADDR:8090/upload" | jq -r .stored_as)
          echo "$stored"
          old="$dir/data/${stored%.gpx}"
          before=$(sudo sha256sum "$old.gpx" "$old.json")
          pids=()
          for n in 1 2; do
            { sudo -u "$TEST_USER" -H env INSTALL_VIEWER_PASSWORD="$PASSWORD" \
              bash "$INSTALLER" --check < /dev/null; } > "check$n.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          cat check1.log check2.log
          test "$failed" = 0
          grep -q 'Deleted the test trip' check1.log
          grep -q 'Deleted the test trip' check2.log
          test "$(sudo sha256sum "$old.gpx" "$old.json")" = "$before"
          test -z "$(sudo find "$dir/data" -name 'install-check-*')"
          sudo rm "$old.gpx" "$old.json"
      - name: --check reports a .env with CRLF endings once
        # Not once per value read from it as well: Compose drops the \r
        # itself, so the services are fine and only the file is wrong.
        run: |
          dir=$(dirname "$INSTALLER")
          sudo -u "$TEST_USER" sed -i 's/$/\r/' "$dir/.env"
          if { sudo -u "$TEST_USER" -H env INSTALL_VIEWER_PASSWORD="$PASSWORD" \
              bash "$INSTALLER" --check < /dev/null; } > crlf.log 2>&1; then
            cat crlf.log
            echo "--check passed with a CRLF .env"
            exit 1
          fi
          cat crlf.log
          grep -q 'CRLF) line endings in .env' crlf.log
          test "$(grep -c '  FAIL  ' crlf.log)" = 1
          sudo -u "$TEST_USER" sed -i 's/\r$//' "$dir/.env"
      - name: Turn on metrics; only the monitor restarts, and it refuses unauthenticated scrapes
        # Runs before the stopped-viewer step, which leaves the viewer down.
        # The monitor's answers go to monitor.env, never to .env.
        run: |
          dir=$(dirname "$INSTALLER")
          before=$(docker inspect -f '{{.State.StartedAt}}' mileage-ingest mileage-viewer)
          { sudo -u "$TEST_USER" -H env INSTALL_KEEP_LOGIN=y INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            INSTALL_KEEP_OUTPUTS=n INSTALL_OUTPUTS=metrics INSTALL_STALE_DAYS=7 \
            bash "$INSTALLER" < /dev/null; } > metrics.log 2>&1 || status=$?
          cat metrics.log
          test "${status:-0}" = 0
          grep -q 'Monitor enabled; ntfy disabled, Graylog disabled, Prometheus enabled, Loki disabled' metrics.log \
            || sudo -u "$TEST_USER" -H bash -c "cd '$dir' && docker compose --profile monitor logs --no-color mileage-monitor" \
              | grep -q 'Monitor enabled; ntfy disabled, Graylog disabled, Prometheus enabled, Loki disabled'
          test "$before" = "$(docker inspect -f '{{.State.StartedAt}}' mileage-ingest mileage-viewer)"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://$LAN_ADDR:8093/metrics")" = 401
          test "$(sudo grep -c METRICS_TOKEN "$dir/.env" || true)" = 0
          { sudo -u "$TEST_USER" -H env INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            bash "$INSTALLER" --check < /dev/null; } > metrics-check.log 2>&1
          cat metrics-check.log
          test "$(grep -c '  FAIL  ' metrics-check.log)" = 0
          grep -q 'Metrics answer with the token (200)' metrics-check.log
          # The Compose hash comparison must work on real Docker, not fall back.
          grep -q 'running with the settings in monitor.env and its Compose configuration' metrics-check.log
          # An edited tuning value that hasn't been applied is reported, then
          # restoring the file makes the hashes match again without a restart.
          pointer=$(sudo sed -n 's/^MONITOR_ENV_FILE=//p' "$dir/.env" | tail -n 1)
          case $pointer in /*) monitor_file=$pointer ;; *) monitor_file=$dir/${pointer#./} ;; esac
          sudo grep -q '^MONITOR_STALE_DAYS=7$' "$monitor_file"
          sudo -u "$TEST_USER" sed -i 's/^MONITOR_STALE_DAYS=7$/MONITOR_STALE_DAYS=8/' "$monitor_file"
          if { sudo -u "$TEST_USER" -H env INSTALL_VIEWER_PASSWORD="$PASSWORD" \
              bash "$INSTALLER" --check < /dev/null; } > stale-monitor.log 2>&1; then
            cat stale-monitor.log
            echo "--check passed with an unapplied monitor.env edit"
            exit 1
          fi
          cat stale-monitor.log
          grep -q 'The monitor is running with older settings than monitor.env' stale-monitor.log
          test "$(grep -c '  FAIL  ' stale-monitor.log)" = 1
          sudo -u "$TEST_USER" sed -i 's/^MONITOR_STALE_DAYS=8$/MONITOR_STALE_DAYS=7/' "$monitor_file"
          { sudo -u "$TEST_USER" -H env INSTALL_VIEWER_PASSWORD="$PASSWORD" \
            bash "$INSTALLER" --check < /dev/null; } > metrics-check2.log 2>&1
          grep -q 'running with the settings in monitor.env and its Compose configuration' metrics-check2.log
      - name: --check reports a stopped viewer without blaming its config
        run: |
          docker stop mileage-viewer
          if { sudo -u "$TEST_USER" -H bash "$INSTALLER" --check < /dev/null; } > stopped.log 2>&1; then
            cat stopped.log
            echo "--check passed with the viewer stopped"
            exit 1
          fi
          cat stopped.log
          grep -q 'mileage-viewer is stopped (exit code 0)' stopped.log
          grep -q 'docker compose up -d' stopped.log
          ! grep -q 'missing or mangled setting in viewer.env' stopped.log
      - name: Release the completed source-copy install and unused runner tools
        env:
          RUN_BUILDER: ${{ needs.firmware-compile.outputs.builder }}
        run: |
          before=$(df -B1 --output=avail / | tail -n 1)
          sudo systemctl disable --now "mileage-backup@$TEST_USER.timer"
          sudo systemctl stop "mileage-backup@$TEST_USER.service"
          sudo bash tools/ci-install/clean-project.sh "$(dirname "$INSTALLER")"
          # This job has exclusive use of this disposable runner's build cache.
          docker builder prune --all --force
          source_after=$(df -B1 --output=avail / | tail -n 1)
          echo "Source-copy project and build cache freed $((source_after - before)) bytes"
          # These hosted tools are unused by the shell/Python/Docker lab. Do
          # this before cache restore so its archive never competes with them.
          if [[ "$RUN_BUILDER" == true ]]; then
            sudo du -sch /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
            sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          fi
          after=$(df -B1 --output=avail / | tail -n 1)
          echo "Unused hosted tools freed $((after - source_after)) bytes"
          echo "Total freed: $((after - before)) bytes"
          df -h /
          docker system df
      - name: Build the exact release assets from this commit
        run: bash tools/build_release_bundle.sh ci "$RUNNER_TEMP/two-piece-assets"
      - name: Restore public builder toolchain image
        if: needs.firmware-compile.outputs.builder == 'true'
        id: builder-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/two-piece-cache
          # Exact public inputs only; never cache personal firmware or settings.
          key: linux-amd64-builder-v2-${{ hashFiles('server/firmware-builder/Dockerfile', 'server/firmware-builder/pins.env') }}
      - name: Download Stage 4 reference
        if: needs.firmware-compile.outputs.builder == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage4-reference
          path: ${{ runner.temp }}/stage4-reference
      - name: Debian 13 bundle install, update, backup/restore and optional builder parity
        env:
          RUN_BUILDER: ${{ needs.firmware-compile.outputs.builder }}
          SAVE_BUILDER_CACHE: ${{ steps.builder-cache.outputs.cache-hit != 'true' }}
        run: |
          df -h /
          docker system df
          # Measured cold lab peak: about 16 GiB including the outer image.
          # Budget 18 GiB and retain at least 4 GiB for runner/log variation.
          min_gib=6
          if [[ "$RUN_BUILDER" == true ]]; then min_gib=22; fi
          available=$(df -B1 --output=avail / | tail -n 1)
          if ((available < min_gib * 1024 * 1024 * 1024)); then
            echo "::error::Lab needs $min_gib GiB free after cleanup; only $available bytes available"
            exit 1
          fi
          bash tools/ci-install/lab.sh "$RUNNER_TEMP/two-piece-assets" \
            "$RUNNER_TEMP/two-piece-cache" "$RUNNER_TEMP/stage4-reference"
      - name: Disk after the lab (including failure)
        if: always()
        run: |
          df -h /
          docker system df

  # Optional check: do not add this job to branch protection's five required checks.
  flash-windows:
    needs: firmware-compile
    if: github.event_name != 'push' && needs.firmware-compile.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze and test PowerShell flash safety without hardware
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $findings = @(Invoke-ScriptAnalyzer -Path install/flash.ps1 -Severity Warning,Error)
          $findings | Format-Table -AutoSize
          if ($findings.Count) { throw 'PSScriptAnalyzer reported findings.' }
          & ./install/tests/flash.Tests.ps1
