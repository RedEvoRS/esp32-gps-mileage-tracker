name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild assets for
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build assets for
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag for asset filenames
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo '::error::Tag must use letters, digits, dots, underscores, pluses or hyphens'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Build and verify release assets
        shell: bash
        run: |
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          assets=$(mktemp -d "$RUNNER_TEMP/release-assets.XXXXXX")
          bash tools/build_release_bundle.sh "$RELEASE_TAG" "$assets" "$commit"
          echo "RELEASE_ASSET_DIR=$assets" >> "$GITHUB_ENV"
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET_DIR"/* --clobber
